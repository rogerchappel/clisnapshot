name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Pack release artifact
        id: package
        run: |
          PACKAGE_TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP")"
          echo "tarball=$RUNNER_TEMP/$PACKAGE_TARBALL" >> "$GITHUB_OUTPUT"
      - name: Verify release artifact installation
        run: npm run package:smoke -- "${{ steps.package.outputs.tarball }}"
      - name: Publish package to npm
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "${PACKAGE_TARBALL}" --provenance --access public
      - name: Generate release notes
        run: node /tmp/releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${PACKAGE_TARBALL}"
